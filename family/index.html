<script>
const tip = document.getElementById('tip');
function showTip(e,h){tip.innerHTML=h;tip.style.opacity='1';moveTip(e);}
function moveTip(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-8)+'px';}
function hideTip(){tip.style.opacity='0';}

function Box(lines, cls, tipHtml) {
  const d = document.createElement('div');
  d.className = 'box' + (cls ? ' '+cls : '');
  lines.forEach((l,i) => {
    const s = document.createElement('div');
    if (i === 0) s.className = 'box-name';
    else if (l.startsWith('b.') || l.includes('–') || l.includes('d.')) s.className = 'box-sub';
    else s.className = 'box-nick';
    s.textContent = l;
    d.appendChild(s);
  });
  if (tipHtml) {
    d.style.cursor = 'pointer';
    d.addEventListener('mouseenter', e => showTip(e, tipHtml));
    d.addEventListener('mousemove', moveTip);
    d.addEventListener('mouseleave', hideTip);
  }
  return d;
}

function VLine(h) {
  const d = document.createElement('div');
  d.className = 'vline';
  d.style.height = h+'px';
  return d;
}

function Heart() {
  const d = document.createElement('div');
  d.className = 'heart';
  d.textContent = '♥';
  return d;
}

function Couple(box1, box2) {
  const d = document.createElement('div');
  d.className = 'couple';
  d.appendChild(box1);
  d.appendChild(Heart());
  d.appendChild(box2);
  return d;
}

const tree = document.getElementById('tree');
const rootWrap = document.createElement('div');
rootWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:100%';

const rootCouple = Couple(
  Box(['Kenneth "Pappy"','1936 – 2026'], 'root',
    '<strong>Kenneth Wayne Buchanan</strong><br>b. Jan 15, 1936 · d. May 2026<br>Mechanical engineer, AT trail maintainer, car restorer'),
  Box(['Patricia, Grandmother','1936 – 2023'], 'root',
    '<strong>Patricia Anne Showers</strong><br>b. Mar 12, 1936 · d. Oct 31, 2023<br>Community band musician, mother of six')
);
rootWrap.appendChild(rootCouple);
rootWrap.appendChild(VLine(20));

const childrenRow = document.createElement('div');
childrenRow.style.cssText = 'display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;justify-content:center';

data.forEach(child => {
  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;align-items:center';
  const childLines = child.nick ? [child.name, child.sub, child.nick] : [child.name, child.sub];
  const childBox = Box(childLines, '', child.tip);
  const spouseBox = Box([child.spouse], 'spouse', child.spouseTip);
  col.appendChild(Couple(childBox, spouseBox));
  col.appendChild(VLine(12));
  const gcList = document.createElement('div');
  gcList.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:5px';
  child.kids.forEach(gc => {
    const gcLines = gc.sub ? [gc.name, gc.sub] : [gc.name];
    gcList.appendChild(Box(gcLines, gc.dec ? 'deceased' : '', gc.tip));
  });
  col.appendChild(gcList);
  childrenRow.appendChild(col);
});

rootWrap.appendChild(childrenRow);
tree.appendChild(rootWrap);
